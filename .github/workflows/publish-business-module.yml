name: Publish an individual business module
on:
  workflow_call:
    inputs:
      foundation_commit:
        required: true
        type: string
      module_id:
        required: true
        type: string
      package_name:
        required: true
        type: string
    secrets:
      RELEASE_PUBLISH_TOKEN:
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: module_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEMPLATEV4_TEST_POSTGRES: Host=localhost;Port=5432;Database=module_tests;Username=postgres;Password=integration-test-only
      MODULE_ID: ${{ inputs.module_id }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      FOUNDATION_COMMIT: ${{ inputs.foundation_commit }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$FOUNDATION_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MODULE_ID" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]
          [[ "$PACKAGE_NAME" =~ ^@[a-z0-9-]+/[a-z0-9-]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thewebchameleon/template-v4
          ref: ${{ inputs.foundation_commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: business-modules
          persist-credentials: false
      - name: Read toolchains
        id: tools
        run: |
          echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(jq -r .toolchains.npm framework.json)" >> "$GITHUB_OUTPUT"
          echo "dotnet=$(jq -r .toolchains.dotnet framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.tools.outputs.node }}
          registry-url: https://npm.pkg.github.com
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ steps.tools.outputs.dotnet }}
      - name: Package the clean source revision
        run: |
          mkdir -p artifacts/module-release
          node tools/releases/cli.mjs module "business-modules/$MODULE_ID" "$PACKAGE_NAME" artifacts/module-release/release.json
          node tools/releases/cli.mjs bundle "business-modules/$MODULE_ID" artifacts/module-release/release.json artifacts/module-release/package
      - name: Validate the release composition with reviewed locks
        env:
          NPM_VERSION: ${{ steps.tools.outputs.npm }}
        run: |
          npm install -g "npm@$NPM_VERSION"
          node tools/prepare-client-release.mjs "$PWD" "$PWD/business-modules" releases/client-modules.json releases/client-locks
          jq -e --arg id "$MODULE_ID" '.privateModules | index($id) != null' client-modules.json
          node tools/discover-business-modules.mjs
          node tools/framework.mjs validate
          node tools/business-module-ids.mjs --check
          npm ci --prefix src/TemplateV4.Angular
          npm run lint --prefix src/TemplateV4.Angular
          npm run build --prefix src/TemplateV4.Angular
          dotnet test src/TemplateV4.Application.Tests -c Release -p:RestoreLockedMode=true
          node tools/test-business-modules.mjs -c Release -p:RestoreLockedMode=true
      - name: Publish artifact before announcing the release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_FEED_URL: ${{ vars.RELEASE_FEED_URL }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          npm pack ./artifacts/module-release/package --ignore-scripts --json --pack-destination artifacts/module-release > artifacts/module-release/pack.json
          archive=$(jq -r '.[0].filename' artifacts/module-release/pack.json)
          node tools/releases/cli.mjs digest artifacts/module-release/release.json "artifacts/module-release/$archive"
          npm publish "artifacts/module-release/$archive" --ignore-scripts --registry=https://npm.pkg.github.com
          node tools/releases/cli.mjs publish artifacts/module-release/release.json
