name: Validate
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain
        id: tools
        run: |
          echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(jq -r .toolchains.npm framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: src/TemplateV4.Angular/package-lock.json
      - run: npm install -g npm@${{ steps.tools.outputs.npm }}
      - run: npm ci --prefix src/TemplateV4.Angular
      - run: npm run format:check --prefix src/TemplateV4.Angular
      - run: npm run lint --prefix src/TemplateV4.Angular
      - name: Test frontend without a browser
        run: >-
          node --test
          tools/appearance.test.mjs
          tools/auth-retry.test.mjs
          tools/capabilities.test.mjs
          tools/gradient-quality.test.mjs
          tools/module-administration.test.mjs
          tools/my-files-ui.test.mjs
          tools/my-files-upload.test.mjs
          tools/ui-sounds.test.mjs
          tools/web-push.test.mjs

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain
        id: tools
        run: |
          echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(jq -r .toolchains.npm framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - run: npm install -g npm@${{ steps.tools.outputs.npm }}
      - run: npm ci --prefix documentation
      - run: npm run build --prefix documentation

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchains
        id: tools
        run: echo "dotnet=$(jq -r .toolchains.dotnet framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.tools.outputs.dotnet }}
      - run: dotnet restore src/TemplateV4.Backend.slnx --locked-mode
      - name: Verify C# formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_SHA" --depth=1
            mapfile -t files < <(git diff --name-only "$BASE_SHA" HEAD -- '*.cs' | grep -v '^src/TemplateV4.Infrastructure/Persistence/Migrations/' || true)
            if [ "${#files[@]}" -gt 0 ]; then
              dotnet format src/TemplateV4.Backend.slnx --verify-no-changes --no-restore --include "${files[@]}"
            fi
          else
            dotnet format src/TemplateV4.Backend.slnx --verify-no-changes --no-restore --exclude src/TemplateV4.Infrastructure/Persistence/Migrations
          fi
      - run: dotnet test src/TemplateV4.Application.Tests/TemplateV4.Application.Tests.csproj -c Release --no-restore --logger trx
      - run: dotnet test src/TemplateV4.Ui.Tests/TemplateV4.Ui.Tests.csproj -c Release --no-restore --logger trx
      - run: dotnet test src/TemplateV4.Utility.Tests/TemplateV4.Utility.Tests.csproj -c Release --no-restore --logger trx

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchains
        id: tools
        run: |
          echo "dotnet=$(jq -r .toolchains.dotnet framework.json)" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(jq -r .toolchains.npm framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.tools.outputs.dotnet }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - run: npm install -g npm@${{ steps.tools.outputs.npm }}
      - run: npm audit --prefix src/TemplateV4.Angular --omit=dev --audit-level=moderate
      - run: dotnet restore src/TemplateV4.Backend.slnx --locked-mode
      - name: Audit NuGet dependencies
        run: node tools/audit-nuget.mjs --no-restore
