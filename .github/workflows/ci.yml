name: CI and Publish
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain
        id: tools
        run: |
          echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(jq -r .toolchains.npm framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: src/TemplateV4.Angular/package-lock.json
      - run: npm install -g npm@${{ steps.tools.outputs.npm }}
      - run: npm ci --prefix src/TemplateV4.Angular
      - run: npm run format:check --prefix src/TemplateV4.Angular
      - run: npm run lint --prefix src/TemplateV4.Angular
      - name: Test frontend without a browser
        run: >-
          node --test
          tools/appearance.test.mjs
          tools/auth-retry.test.mjs
          tools/capabilities.test.mjs
          tools/gradient-quality.test.mjs
          tools/module-administration.test.mjs
          tools/file-storage-ui.test.mjs
          tools/file-storage-upload.test.mjs
          tools/ui-sounds.test.mjs
          tools/web-push.test.mjs

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain
        id: tools
        run: |
          echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(jq -r .toolchains.npm framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - run: npm install -g npm@${{ steps.tools.outputs.npm }}
      - run: npm ci --prefix documentation
      - run: npm run build --prefix documentation

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchains
        id: tools
        run: echo "dotnet=$(jq -r .toolchains.dotnet framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.tools.outputs.dotnet }}
      - run: dotnet restore src/TemplateV4.slnx --locked-mode
      - name: Verify C# formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_SHA" --depth=1
            mapfile -t files < <(git diff --name-only "$BASE_SHA" HEAD -- '*.cs' | grep -v '^src/TemplateV4.Persistence/Persistence/Migrations/' || true)
            if [ "${#files[@]}" -gt 0 ]; then
              dotnet format src/TemplateV4.slnx --verify-no-changes --no-restore --include "${files[@]}"
            fi
          else
            dotnet format src/TemplateV4.slnx --verify-no-changes --no-restore --exclude src/TemplateV4.Persistence/Persistence/Migrations
          fi
      - run: dotnet test src/TemplateV4.Application.Tests/TemplateV4.Application.Tests.csproj -c Release --no-restore --logger trx

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchains
        id: tools
        run: |
          echo "dotnet=$(jq -r .toolchains.dotnet framework.json)" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(jq -r .toolchains.npm framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.tools.outputs.dotnet }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - run: npm install -g npm@${{ steps.tools.outputs.npm }}
      - run: npm audit --prefix src/TemplateV4.Angular --omit=dev --audit-level=moderate
      - run: dotnet restore src/TemplateV4.slnx --locked-mode
      - name: Audit NuGet dependencies
        run: node tools/audit-nuget.mjs --no-restore

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, documentation, backend, vulnerabilities]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {
              name: api,
              project: TemplateV4.ApiService,
              dockerfile: deploy/Dockerfile.dotnet,
            }
          - {
              name: worker,
              project: TemplateV4.BackgroundWorker,
              dockerfile: deploy/Dockerfile.dotnet,
            }
          - {
              name: migrator,
              project: TemplateV4.DatabaseMigrator,
              dockerfile: deploy/Dockerfile.dotnet,
            }
          - {
              name: web,
              project: Web,
              dockerfile: src/TemplateV4.Angular/Dockerfile,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.dockerfile }}
          build-args: PROJECT=${{ matrix.project }}
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.names.outputs.repository }}/${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
