name: Publish packages and images
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  announce:
    needs: [packages, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read Node version
        id: tools
        run: echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - name: Publish successful release metadata
        env:
          RELEASE_FEED_URL: ${{ vars.RELEASE_FEED_URL }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file releases/migration-notes.txt
          fi
          node tools/releases/cli.mjs foundation release-metadata.json \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            releases/migration-notes.txt "$(jq -r .breaking releases/foundation.json)"
          node tools/releases/cli.mjs publish release-metadata.json
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
        run: |
          test -n "$SLACK_WEBHOOK_URL"
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          text=$(printf '%s\n' \
            ":white_check_mark: *Release $GITHUB_REF_NAME completed successfully*" \
            "• api: :white_check_mark: $image_root/api:$GITHUB_REF_NAME" \
            "• worker: :white_check_mark: $image_root/worker:$GITHUB_REF_NAME" \
            "• migrator: :white_check_mark: $image_root/migrator:$GITHUB_REF_NAME" \
            "• web: :white_check_mark: $image_root/web:$GITHUB_REF_NAME" \
            "<$run_url|View workflow run>")
          curl --fail-with-body --silent --show-error --retry 3 \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg text "$text" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL"
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify validated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .frameworkVersion framework.json)"
          run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful main CI run found for $GITHUB_SHA."
            exit 1
          fi
          echo "Using validated artifacts from CI run $run_id."
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify validated images
        run: |
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          for image in api worker migrator web; do
            docker manifest inspect "$image_root/$image:sha-$GITHUB_SHA" >/dev/null
          done
  packages:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read SDK
        id: sdk
        run: |
          echo "version=$(jq -r .toolchains.dotnet framework.json)" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -r .toolchains.node framework.json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(jq -r .toolchains.npm framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.sdk.outputs.node }}
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: src/TemplateV4.Angular/package-lock.json
      - run: npm install -g npm@${{ steps.sdk.outputs.npm }}
      - run: npm ci --prefix src/TemplateV4.Angular
      - name: Pack framework packages
        shell: pwsh
        run: |
          dotnet restore src/TemplateV4.slnx --locked-mode
          ./tools/pack-foundation.ps1 -Version ((Get-Content framework.json -Raw | ConvertFrom-Json).frameworkVersion)
      - name: Publish to configured owner feed
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ vars.PACKAGE_OWNER }}
        run: |
          test -n "$PACKAGE_OWNER"
          dotnet nuget push 'artifacts/packages/*/*.nupkg' --source "https://nuget.pkg.github.com/${PACKAGE_OWNER}/index.json" --api-key "$PACKAGE_TOKEN"
      - name: Publish configured npm scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_PACKAGE_SCOPE: ${{ vars.NPM_PACKAGE_SCOPE }}
        run: |
          test -n "$NPM_PACKAGE_SCOPE"
          node tools/configure-npm-scope.mjs "$NPM_PACKAGE_SCOPE"
          npm publish src/TemplateV4.Angular/dist/foundation --registry=https://npm.pkg.github.com
  publish:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Tag validated images for release
        env:
          IMAGE_ROOT: ghcr.io/${{ steps.names.outputs.repository }}
        run: |
          for image in api worker migrator web; do
            docker buildx imagetools create \
              --tag "$IMAGE_ROOT/$image:$GITHUB_REF_NAME" \
              "$IMAGE_ROOT/$image:sha-$GITHUB_SHA"
          done
