name: Publish images
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  packages:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read SDK
        id: sdk
        run: echo "version=$(jq -r .toolchains.dotnet framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Pack framework packages
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .frameworkVersion framework.json)"
          jq -r '.packages[]' framework.json | while read project; do
            dotnet pack "$project" -c Release -o artifacts/packages -p:RestoreLockedMode=true
          done
      - name: Publish to repository owner feed
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push 'artifacts/packages/*.nupkg' --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "$PACKAGE_TOKEN" --skip-duplicate
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: api, project: TemplateV4.ApiService, dockerfile: deploy/Dockerfile.dotnet}
          - {name: worker, project: TemplateV4.BackgroundWorker, dockerfile: deploy/Dockerfile.dotnet}
          - {name: migrator, project: TemplateV4.DatabaseMigrator, dockerfile: deploy/Dockerfile.dotnet}
          - {name: web, project: Web, dockerfile: src/TemplateV4.Angular/Dockerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release version
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .frameworkVersion framework.json)"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: PROJECT=${{ matrix.project }}
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.repository }}/${{ matrix.name }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.repository }}/${{ matrix.name }}:${{ github.ref_name }}
