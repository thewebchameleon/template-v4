name: templatev4-storage
services:
  storage:
    image: chrislusf/seaweedfs:4.45
    command: [mini, '-dir=/data', '-bucket=templatev4', '-s3.config=/run/secrets/s3_config']
    restart: unless-stopped
    expose: ['8333']
    volumes: ['storage:/data']
    secrets: [s3_config]
    stop_grace_period: 60s
secrets:
  s3_config: {file: '${SECRETS_DIR:?Set SECRETS_DIR}/seaweedfs_s3.json'}
volumes:
  storage:
