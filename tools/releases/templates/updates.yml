name: Check template and module updates
on:
  schedule:
    - cron: "19 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  packages: write
concurrency:
  group: client-template-updates
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: configuration
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thewebchameleon/template-v4
          ref: __FOUNDATION_COMMIT__
          path: tooling
          persist-credentials: false
      - name: Read toolchain
        id: tools
        run: echo "node=$(jq -r .toolchains.node tooling/framework.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - name: Check entitled releases
        id: check
        working-directory: configuration
        env:
          RELEASE_FEED_URL: ${{ vars.RELEASE_FEED_URL }}
          RELEASE_FEED_TOKEN: ${{ secrets.RELEASE_FEED_TOKEN }}
        run: node ../tooling/tools/releases/cli.mjs check client-template.json "$RUNNER_TEMP/update-body.md"
      - name: Open or update the upgrade pull request
        if: steps.check.outputs.changed == 'true'
        working-directory: configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve changes already made by reviewers on the upgrade branch.
          cp client-template.json "$RUNNER_TEMP/proposed-template.json"
          git restore client-template.json
          if git ls-remote --exit-code --heads origin codex/template-updates >/dev/null; then
            git fetch origin codex/template-updates
            git switch -c codex/template-updates FETCH_HEAD
          else
            git switch -c codex/template-updates
          fi
          cp client-template.json "$RUNNER_TEMP/previous-template.json"
          cp "$RUNNER_TEMP/proposed-template.json" client-template.json
          node ../tooling/tools/releases/cli.mjs workflow-pins "$RUNNER_TEMP/previous-template.json" client-template.json "$PWD"
          git add client-template.json .github/workflows/release.yml .github/workflows/updates.yml .github/workflows/validate.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Update pinned template and business modules'
            git push origin HEAD:codex/template-updates
          fi
          number=$(gh pr list --head codex/template-updates --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/update-body.md"
          else
            gh pr create --draft --head codex/template-updates --title 'Update template and business modules' --body-file "$RUNNER_TEMP/update-body.md"
          fi
  validate:
    needs: propose
    if: needs.propose.outputs.changed == 'true'
    uses: thewebchameleon/template-v4/.github/workflows/compose-release.yml@__FOUNDATION_COMMIT__
    with:
      template_file: client-template.json
      selection_file: client-modules.json
      configuration_ref: codex/template-updates
      validate_only: true
    secrets:
      MODULE_PACKAGES_TOKEN: ${{ secrets.MODULE_PACKAGES_TOKEN }}
