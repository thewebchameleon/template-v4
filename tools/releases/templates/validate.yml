name: Validate pinned client
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  validate:
    # Fork pull requests do not receive private module credentials.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    uses: thewebchameleon/template-v4/.github/workflows/compose-release.yml@__FOUNDATION_COMMIT__
    with:
      template_file: client-template.json
      selection_file: client-modules.json
      validate_only: true
    secrets:
      MODULE_PACKAGES_TOKEN: ${{ secrets.MODULE_PACKAGES_TOKEN }}
