<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#E6F2FF"/>
      <stop offset=".33" stop-color="#B3D9FF"/>
      <stop offset=".67" stop-color="#80B3FF"/>
      <stop offset="1" stop-color="#6699E6"/>
    </linearGradient>
    <linearGradient id="fade" x2="0" y2="1">
      <stop stop-color="white" stop-opacity=".85"/>
      <stop offset=".75" stop-color="white" stop-opacity=".2"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="clouds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".003 .005" numOctaves="4" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .98 0 0 0 0 .99 0 0 0 0 1 0 0 0 3 -1.25"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <mask id="cloud-fade"><rect width="1000" height="1200" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1000" height="1200" fill="url(#sky)"/>
  <rect width="1000" height="1200" filter="url(#clouds)" mask="url(#cloud-fade)"/>
  <rect width="1000" height="1200" filter="url(#grain)" opacity=".06" style="mix-blend-mode:soft-light"/>
</svg>
