<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0;padding:0;background:#f3f5f9">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent">{{PREHEADER}}</div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#f3f5f9" style="background:#f3f5f9">
    <tr><td align="center" style="padding:32px 16px 40px">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:600px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px">
        <tr><td bgcolor="{{PRIMARY_COLOR}}" style="height:6px;background:{{PRIMARY_COLOR}};font-size:0;line-height:6px">&nbsp;</td></tr>
        <tr><td style="padding:30px 40px 24px">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>{{LOGO}}<td style="vertical-align:middle;color:#0f172a;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;line-height:26px">{{BRAND_NAME}}</td></tr></table>
        </td></tr>
        <tr><td style="padding:0 40px"><div style="height:1px;background:#e2e8f0;line-height:1px">&nbsp;</div></td></tr>
        <tr><td style="padding:34px 40px 38px">
          {{EMAIL_CONTENT}}
        </td></tr>
      </table>
      <p style="max-width:600px;margin:20px 0 0;color:#64748b;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;text-align:center">Hierdie is 'n outomatiese boodskap van {{BRAND_NAME}}.</p>
    </td></tr>
  </table>
</body>
</html>
