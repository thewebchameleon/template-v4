name: templatev4
services:
  storage:
    image: chrislusf/seaweedfs:4.45
    command: [mini, '-dir=/data', '-bucket=templatev4']
    environment:
      AWS_ACCESS_KEY_ID: local-development
      AWS_SECRET_ACCESS_KEY: local-development-only-change-in-production
    ports: ['127.0.0.1:8333:8333']
    volumes: ['storage:/data']
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30
  key-permissions:
    image: postgres:18.6-alpine
    user: "0"
    entrypoint: ["sh", "-c", "chown 1654:1654 /keys && chmod 700 /keys"]
    volumes: ["keys:/keys"]
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: templatev4
      POSTGRES_USER: templatev4
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templatev4 -d templatev4"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.0
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  migrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet
      args: {PROJECT: TemplateV4.DatabaseMigrator}
    environment: &environment
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__app: Host=postgres;Database=templatev4;Username=templatev4;Password=${POSTGRES_PASSWORD}
      DataProtection__KeyPath: /keys
      Jwt__PrivateKeyPath: /secrets/jwt.pem
      Jwt__KeyId: local-v1
      Web__PublicUrl: https://localhost:8443
      Web__AllowedOrigins__0: https://localhost:8443
      Storage__Provider: S3
      Storage__S3__Endpoint: http://storage:8333
      Storage__S3__Bucket: templatev4
      Storage__S3__AccessKey: local-development
      Storage__S3__SecretKey: local-development-only-change-in-production
    volumes: ["keys:/keys", "./.local/jwt.pem:/secrets/jwt.pem:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      key-permissions: {condition: service_completed_successfully}
  api:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.ApiService}}
    environment:
      <<: *environment
      ReverseProxy__Address: 172.29.0.10
    volumes: ["keys:/keys", "./.local/jwt.pem:/secrets/jwt.pem:ro"]
    depends_on:
      migrator: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.BackgroundWorker}}
    environment:
      <<: *environment
      Email__Host: mailpit
      Email__Port: 1025
    volumes: ["keys:/keys"]
    depends_on:
      migrator: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: src/TemplateV4.Angular/Dockerfile}
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["./.local/web.pem:/run/secrets/web.pem:ro", "./.local/web.key:/run/secrets/web.key:ro"]
    networks:
      default: {ipv4_address: 172.29.0.10}
    depends_on: [api]
volumes:
  postgres:
  keys:
  storage:
networks:
  default:
    ipam:
      config: [{subnet: 172.29.0.0/24}]
