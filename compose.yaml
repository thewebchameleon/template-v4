x-runtime: &runtime
  ASPNETCORE_ENVIRONMENT: Production
  DataProtection__KeyPath: /keys/ring
  DataProtection__CertificateBase64: ${DP_CERTIFICATE_B64:?Set DP_CERTIFICATE_B64}
  DataProtection__CertificatePassword: ${DP_PASSWORD:?Set DP_PASSWORD}
  Web__PublicUrl: ${PUBLIC_URL:?Set PUBLIC_URL to the public HTTPS origin}
  Jwt__KeyId: ${JWT_KEY_ID:?Set JWT_KEY_ID}
  Deployment__Version: sha-a8e97f3
  Updates__Enabled: ${UPDATES_ENABLED}
  Updates__FeedUrl: ${UPDATES_FEED_URL}
  Storage__Provider: S3
  Storage__S3__Endpoint: ${S3_ENDPOINT:?Set S3_ENDPOINT}
  Storage__S3__Bucket: ${S3_BUCKET:?Set S3_BUCKET}
  Storage__S3__Region: ${S3_REGION:?Set S3_REGION}
  Storage__S3__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
  Storage__S3__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
x-health: &health
  test: [CMD, dotnet, entry.dll, --health-check]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: templatev4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD}
      API_PASSWORD: ${API_PASSWORD:?Set API_PASSWORD}
      WORKER_PASSWORD: ${WORKER_PASSWORD:?Set WORKER_PASSWORD}
    volumes:
      [
        postgres:/var/lib/postgresql,
        "./deploy/init-database.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro",
      ]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d templatev4]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
  migrator:
    image: ghcr.io/thewebchameleon/template-v4/migrator:sha-a8e97f3626475174589e1e1cb02e19a63f1c9397
    pull_policy: always
    environment:
      <<: *runtime
      ConnectionStrings__app: ${MIGRATOR_CONNECTION_STRING:?Set MIGRATOR_CONNECTION_STRING}
      Database__GrantRuntimeRoles: "true"
    volumes: [keys:/keys]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    image: ghcr.io/thewebchameleon/template-v4/api:sha-a8e97f3626475174589e1e1cb02e19a63f1c9397
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *runtime
      ConnectionStrings__app: ${API_CONNECTION_STRING:?Set API_CONNECTION_STRING}
      Jwt__PrivateKeyBase64: ${JWT_KEY_B64:?Set JWT_KEY_B64}
      ReverseProxy__Address: ${WEB_PROXY_IP:?Set WEB_PROXY_IP}
    volumes: [keys:/keys]
    depends_on:
      migrator: { condition: service_completed_successfully }
    healthcheck: *health
    stop_grace_period: 60s
  worker:
    image: ghcr.io/thewebchameleon/template-v4/worker:sha-a8e97f3626475174589e1e1cb02e19a63f1c9397
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *runtime
      ConnectionStrings__app: ${WORKER_CONNECTION_STRING:?Set WORKER_CONNECTION_STRING}
      Email__Host: ${SMTP_HOST}
      Email__Port: ${SMTP_PORT}
      Email__From: ${SMTP_FROM}
      Email__Username: ${SMTP_USERNAME}
      Email__Password: ${SMTP_PASSWORD}
    volumes: [keys:/keys]
    depends_on:
      migrator: { condition: service_completed_successfully }
    healthcheck: *health
    stop_grace_period: 60s
  storage:
    image: chrislusf/seaweedfs:4.45
    restart: unless-stopped
    environment:
      SEAWEED_CONFIG_JSON: ${SEAWEED_CONFIG_JSON:?Set SEAWEED_CONFIG_JSON}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        printf '%s' "$$SEAWEED_CONFIG_JSON" > /tmp/s3.json
        exec weed mini -dir=/data -bucket=templatev4 -s3.config=/tmp/s3.json
    expose: ["8333"]
    volumes: [storage:/data]
    stop_grace_period: 60s
  web:
    image: ghcr.io/thewebchameleon/template-v4/web:sha-a8e97f3626475174589e1e1cb02e19a63f1c9397
    pull_policy: always
    restart: unless-stopped
    expose: ["8080"]
    depends_on:
      api: { condition: service_healthy }
    networks:
      default: { ipv4_address: "${WEB_PROXY_IP:?Set WEB_PROXY_IP}" }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
volumes:
  postgres:
  keys:
  storage:
networks:
  default:
    ipam:
      config: [{ subnet: "${COMPOSE_SUBNET:?Set COMPOSE_SUBNET}" }]
