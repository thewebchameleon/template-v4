name: templatev4-production
x-runtime: &runtime
  ASPNETCORE_ENVIRONMENT: Production
  DataProtection__KeyPath: /keys/ring
  DataProtection__AllowUnencryptedKeys: "true"
  Web__PublicUrl: ${PUBLIC_URL}
  Jwt__KeyId: ${JWT_KEY_ID}
  Updates__Enabled: ${UPDATES_ENABLED}
  Storage__Provider: S3
  Storage__S3__Endpoint: ${S3_ENDPOINT}
  Storage__S3__Bucket: ${S3_BUCKET}
  Storage__S3__Region: ${S3_REGION}
  Storage__S3__AccessKey: ${S3_ACCESS_KEY}
  Storage__S3__SecretKey: ${S3_SECRET_KEY}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
x-health: &health
  test: [CMD, dotnet, entry.dll, --health-check]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: templatev4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql, './deploy/init-database.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d templatev4]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
  migrator:
    image: ghcr.io/thewebchameleon/template-v4/migrator@sha256:dd3f361f4f42328d19e37997e072eb05f349eb4db16e540034fe3737fc6e85d0
    environment:
      <<: *runtime
      ConnectionStrings__app: Host=postgres;Database=templatev4;Username=templatev4_migrator;Password=${POSTGRES_PASSWORD}
      Database__GrantRuntimeRoles: 'true'
    volumes: [keys:/keys]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: ghcr.io/thewebchameleon/template-v4/api@sha256:04f10bad000d3116cd759e9a5592c7b7c074e7c95621e9a2dbaf45544c73081c
    restart: unless-stopped
    environment:
      <<: *runtime
      ConnectionStrings__app: Host=postgres;Database=templatev4;Username=templatev4_api;Password=${POSTGRES_PASSWORD}
      Jwt__PrivateKeyBase64: ${JWT_KEY_B64}
      ReverseProxy__Address: ${WEB_PROXY_IP}
      OTEL_SERVICE_NAME: templatev4-api
    volumes: [keys:/keys]
    depends_on:
      migrator: {condition: service_completed_successfully}
    healthcheck: *health
    stop_grace_period: 60s
  worker:
    image: ghcr.io/thewebchameleon/template-v4/worker@sha256:82f738a19a628f2e322c4d21a27a5b319ab0f63353379fe8b449e3ab77ae782e
    restart: unless-stopped
    environment:
      <<: *runtime
      ConnectionStrings__app: Host=postgres;Database=templatev4;Username=templatev4_worker;Password=${POSTGRES_PASSWORD}
      Email__Host: ${SMTP_HOST}
      Email__Port: ${SMTP_PORT}
      Email__From: ${SMTP_FROM}
      Email__Username: ${SMTP_USERNAME}
      Email__Password: ${SMTP_PASSWORD}
      OTEL_SERVICE_NAME: templatev4-worker
    volumes: [keys:/keys]
    depends_on:
      migrator: {condition: service_completed_successfully}
    healthcheck: *health
    stop_grace_period: 60s
  storage:
    image: chrislusf/seaweedfs:4.45
    restart: unless-stopped
    environment:
      SEAWEED_CONFIG_JSON: ${SEAWEED_CONFIG_JSON}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        printf '%s' "$$SEAWEED_CONFIG_JSON" > /tmp/s3.json
        exec weed mini -dir=/data -bucket=templatev4 -s3.config=/tmp/s3.json
    expose: ["8333"]
    volumes: [storage:/data]
    stop_grace_period: 60s
  web:
    image: ghcr.io/thewebchameleon/template-v4/web@sha256:ee29b4aa4de7b9bf84cba9783476110ac12f71eadb20b6fd5ced069ef362a661
    restart: unless-stopped
    expose: ['8080']
    depends_on:
      api: {condition: service_healthy}
    networks:
      default: {ipv4_address: "${WEB_PROXY_IP}"}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
volumes:
  postgres:
  keys:
  storage:
networks:
  default:
    ipam:
      config: [{subnet: "${COMPOSE_SUBNET}"}]
