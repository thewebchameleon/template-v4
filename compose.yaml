name: templatev4
services:
  storage:
    image: chrislusf/seaweedfs:4.45
    command: [mini, '-dir=/data', '-bucket=templatev4']
    environment:
      AWS_ACCESS_KEY_ID: local-development
      AWS_SECRET_ACCESS_KEY: local-development-only-change-in-production
    ports: ['127.0.0.1:8333:8333']
    volumes: ['storage:/data']
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: templatev4
      POSTGRES_USER: templatev4
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT}:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templatev4 -d templatev4"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.0
    ports: ["127.0.0.1:${MAILPIT_HTTP_PORT}:8025", "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"]
  migrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet
      args: {PROJECT: TemplateV4.DatabaseMigrator}
    environment: &environment
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__app: Host=postgres;Database=templatev4;Username=templatev4;Password=${POSTGRES_PASSWORD}
      DataProtection__KeyPath: /keys/ring
      Jwt__PrivateKeyPath: /secrets/jwt.pem
      Jwt__KeyId: local-v1
      Web__PublicUrl: ${PUBLIC_URL}
      Web__AllowedOrigins__0: ${PUBLIC_URL}
      Security__RequireAdministratorPasskey: ${REQUIRE_ADMINISTRATOR_PASSKEY}
      Storage__Provider: S3
      Storage__S3__Endpoint: http://storage:8333
      Storage__S3__Bucket: templatev4
      Storage__S3__AccessKey: local-development
      Storage__S3__SecretKey: local-development-only-change-in-production
    volumes: ["keys:/keys", "./.local/jwt.pem:/secrets/jwt.pem:ro"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.ApiService}}
    environment:
      <<: *environment
      ReverseProxy__Address: web
    volumes: ["keys:/keys", "./.local/jwt.pem:/secrets/jwt.pem:ro"]
    depends_on:
      migrator: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.BackgroundWorker}}
    environment:
      <<: *environment
      Email__Host: mailpit
      Email__Port: 1025
    volumes: ["keys:/keys"]
    depends_on:
      migrator: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: src/TemplateV4.Angular/Dockerfile}
    ports: ["127.0.0.1:${WEB_HTTPS_PORT}:8443"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./.local/web.pem:/run/secrets/web.pem:ro", "./.local/web.key:/run/secrets/web.key:ro"]
    depends_on: [api]
  release-feed:
    profiles: [release-feed]
    build: {context: ., dockerfile: services/release-feed/Dockerfile}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${RELEASE_FEED_PORT}:8080"]
    volumes: ["releases:/data", "./services/release-feed/release-credentials.json:/run/secrets/release-credentials.json:ro"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres:
  keys:
  storage:
  releases:
