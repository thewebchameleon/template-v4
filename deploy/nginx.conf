server {
  listen 8443 ssl;
  server_tokens off;
  ssl_certificate /run/secrets/web.pem;
  ssl_certificate_key /run/secrets/web.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  client_max_body_size 20m;
  proxy_read_timeout 90s;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sandbox.payfast.co.za https://www.payfast.co.za" always;
  location = /runtime-config.json { add_header Cache-Control "no-store"; }
  location /api/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
  location / { try_files $uri $uri/ /index.html; }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
