name: Release client example
on:
  workflow_dispatch:
    inputs:
      foundation_ref:
        description: TemplateV4 branch, tag or commit
        type: string
        default: main
        required: true
      business_ref:
        description: Business modules branch, tag or commit
        type: string
        default: main
        required: true
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: thewebchameleon/template-v4/.github/workflows/compose-release.yml@main
    with:
      foundation_ref: ${{ inputs.foundation_ref }}
      # Replace this example owner with the organization that owns the private modules.
      business_repository: your-organisation/business-modules
      business_ref: ${{ inputs.business_ref }}
      selection_file: client-modules.json
      deployment_branch: deploy
    secrets:
      BUSINESS_MODULES_TOKEN: ${{ secrets.BUSINESS_MODULES_TOKEN }}
