resolver 127.0.0.11 valid=10s ipv6=off;
map $http_x_forwarded_for $trusted_forwarded_for {
  default $http_x_forwarded_for;
  '' $remote_addr;
}
upstream application_api {
  zone application_api 64k;
  server api:8080 resolve;
  keepalive 32;
}
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /runtime-config.json { expires -1; }
  location /api/ {
    proxy_pass http://application_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $trusted_forwarded_for;
    # Public traffic is HTTPS at the hosting platform; Nginx-to-container traffic is HTTP.
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }
  location / { try_files $uri $uri/ /index.html; }
}
