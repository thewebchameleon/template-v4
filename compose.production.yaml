name: templatev4-production
x-runtime: &runtime
  ASPNETCORE_ENVIRONMENT: Production
  DataProtection__KeyPath: /keys
  DataProtection__CertificatePath: /run/secrets/dp_certificate
  Web__PublicUrl: ${PUBLIC_URL:?Set PUBLIC_URL to the public HTTPS origin}
  Jwt__KeyId: ${JWT_KEY_ID:?Set JWT_KEY_ID}
x-health: &health
  test: [CMD, dotnet, entry.dll, --health-check]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s
services:
  key-permissions:
    image: postgres:18.6-alpine
    user: '0'
    entrypoint: [sh, -c, 'chown 1654:1654 /keys && chmod 700 /keys']
    volumes: [keys:/keys]
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: templatev4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, migrator_password, api_password, worker_password]
    volumes: [postgres:/var/lib/postgresql, './deploy/init-database.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d templatev4]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
  migrator:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.DatabaseMigrator}}
    environment:
      <<: *runtime
      Database__GrantRuntimeRoles: 'true'
    secrets:
      - {source: migrator_connection, target: ConnectionStrings__app}
      - dp_certificate
      - {source: dp_password, target: DataProtection__CertificatePassword}
    volumes: [keys:/keys]
    depends_on:
      postgres: {condition: service_healthy}
      key-permissions: {condition: service_completed_successfully}
  api:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.ApiService}}
    restart: unless-stopped
    environment:
      <<: *runtime
      Jwt__PrivateKeyPath: /run/secrets/jwt_key
      ReverseProxy__Address: 172.30.0.10
    secrets:
      - {source: api_connection, target: ConnectionStrings__app}
      - jwt_key
      - dp_certificate
      - {source: dp_password, target: DataProtection__CertificatePassword}
    volumes: [keys:/keys]
    depends_on:
      migrator: {condition: service_completed_successfully}
    healthcheck: *health
    stop_grace_period: 60s
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.BackgroundWorker}}
    restart: unless-stopped
    environment:
      <<: *runtime
      Email__Host: ${SMTP_HOST:?Set SMTP_HOST}
      Email__Port: ${SMTP_PORT:-587}
      Email__From: ${SMTP_FROM:?Set SMTP_FROM}
    secrets:
      - {source: worker_connection, target: ConnectionStrings__app}
      - {source: smtp_username, target: Email__Username}
      - {source: smtp_password, target: Email__Password}
      - dp_certificate
      - {source: dp_password, target: DataProtection__CertificatePassword}
    volumes: [keys:/keys]
    depends_on:
      migrator: {condition: service_completed_successfully}
    healthcheck: *health
    stop_grace_period: 60s
  web:
    build: {context: ., dockerfile: src/TemplateV4.Angular/Dockerfile}
    restart: unless-stopped
    expose: ['8080']
    volumes: ['./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      api: {condition: service_healthy}
    networks:
      default: {ipv4_address: 172.30.0.10}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
secrets:
  postgres_password: {file: '${SECRETS_DIR:?Set SECRETS_DIR}/postgres_password'}
  migrator_password: {file: '${SECRETS_DIR}/migrator_password'}
  api_password: {file: '${SECRETS_DIR}/api_password'}
  worker_password: {file: '${SECRETS_DIR}/worker_password'}
  migrator_connection: {file: '${SECRETS_DIR}/migrator_connection'}
  api_connection: {file: '${SECRETS_DIR}/api_connection'}
  worker_connection: {file: '${SECRETS_DIR}/worker_connection'}
  jwt_key: {file: '${SECRETS_DIR}/jwt_key'}
  dp_certificate: {file: '${SECRETS_DIR}/dp_certificate'}
  dp_password: {file: '${SECRETS_DIR}/dp_password'}
  smtp_username: {file: '${SECRETS_DIR}/smtp_username'}
  smtp_password: {file: '${SECRETS_DIR}/smtp_password'}
volumes:
  postgres:
  keys:
networks:
  default:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
