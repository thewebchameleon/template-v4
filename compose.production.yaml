name: templatev4-production
x-runtime: &runtime
  ASPNETCORE_ENVIRONMENT: Production
  DataProtection__KeyPath: /keys/ring
  DataProtection__AllowUnencryptedKeys: "true"
  Web__PublicUrl: ${PUBLIC_URL}
  Jwt__KeyId: ${JWT_KEY_ID}
  Updates__Enabled: ${UPDATES_ENABLED}
  Storage__Provider: S3
  Storage__S3__Endpoint: ${S3_ENDPOINT}
  Storage__S3__Bucket: ${S3_BUCKET}
  Storage__S3__Region: ${S3_REGION}
  Storage__S3__AccessKey: ${S3_ACCESS_KEY}
  Storage__S3__SecretKey: ${S3_SECRET_KEY}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
x-health: &health
  test: [CMD, dotnet, entry.dll, --health-check]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s
services:
  pdf:
    image: gotenberg/gotenberg:8.37.0
    restart: unless-stopped
    expose: ['3000']
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: templatev4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d templatev4]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
  migrator:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.DatabaseMigrator}}
    environment:
      <<: *runtime
      ConnectionStrings__app: Host=postgres;Database=templatev4;Username=postgres;Password=${POSTGRES_PASSWORD}
    volumes: [keys:/keys]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.ApiService}}
    restart: unless-stopped
    environment:
      <<: *runtime
      ConnectionStrings__app: Host=postgres;Database=templatev4;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__PrivateKeyBase64: ${JWT_KEY_B64}
      ReverseProxy__Address: web
      Pdf__RendererUrl: http://pdf:3000
      ModuleDistribution__Url: ${MODULE_DISTRIBUTION_URL:-}
      ModuleDistribution__AppId: ${MODULE_APP_ID:-}
      ModuleDistribution__AppToken: ${MODULE_APP_TOKEN:-}
      ModuleDistribution__EnvironmentId: ${MODULE_ENVIRONMENT_ID:-}
      ModuleDistribution__Environment: ${MODULE_ENVIRONMENT:-production}
      ClientManagement__PublisherTokenHash: ${MODULE_PUBLISHER_TOKEN_HASH:-}
      ClientManagement__PublisherModules: ${MODULE_PUBLISHER_MODULES:-}
      ClientManagement__ArtifactHosts: ${MODULE_ARTIFACT_HOSTS:-}
      ClientManagement__ArtifactToken: ${MODULE_ARTIFACT_TOKEN:-}
      OTEL_SERVICE_NAME: templatev4-api
    volumes: [keys:/keys]
    depends_on:
      migrator: {condition: service_completed_successfully}
      pdf: {condition: service_started}
    healthcheck: *health
    stop_grace_period: 60s
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile.dotnet, args: {PROJECT: TemplateV4.BackgroundWorker}}
    restart: unless-stopped
    environment:
      <<: *runtime
      ConnectionStrings__app: Host=postgres;Database=templatev4;Username=postgres;Password=${POSTGRES_PASSWORD}
      Email__Host: ${SMTP_HOST}
      Email__Port: ${SMTP_PORT}
      Email__From: ${SMTP_FROM}
      Email__Username: ${SMTP_USERNAME}
      Email__Password: ${SMTP_PASSWORD}
      OTEL_SERVICE_NAME: templatev4-worker
    volumes: [keys:/keys]
    depends_on:
      migrator: {condition: service_completed_successfully}
    healthcheck: *health
    stop_grace_period: 60s
  storage:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    environment:
      SEAWEED_CONFIG_JSON: ${SEAWEED_CONFIG_JSON}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        printf '%s' "$$SEAWEED_CONFIG_JSON" > /tmp/s3.json
        exec weed mini -dir=/data -bucket=templatev4 -s3.config=/tmp/s3.json
    expose: ["8333"]
    volumes: [storage:/data]
    stop_grace_period: 60s
  web:
    build: {context: ., dockerfile: src/TemplateV4.Angular/Dockerfile}
    restart: unless-stopped
    expose: ['8080']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
volumes:
  postgres:
  keys:
  storage:
